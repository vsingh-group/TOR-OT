# Main Hydra configuration file
defaults:
  - _self_
  - model:    default
  - training: default
  - tokenizer: default
  - data:     default
  - logging:  default

# Global settings
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  # Configure logging
  job_logging:
    version: 1
    formatters:
      simple:
        format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        level: INFO
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        level: INFO
        formatter: simple
        filename: ${hydra:runtime.output_dir}/train_regression_singletarget_hydra.log
        mode: w
    root:
      level: INFO
      handlers: [console, file]
    disable_existing_loggers: false

# Default values that can be overridden
model_save_path: null  # Will use default directory if null 