# CPU-optimized data configuration for local development
data_dir: "./decoder4ot/experiments/singletarget/ot_sample_data/n_5k/support_10"

# Dataset parameters
dataset:
  size: 5000  # Medium dataset for CPU training
  support_size: 10  # Standard support size
  feature_dim: 21  # Dimension of input features
  target_dim: 1  # Dimension of target values
  num_targets: 1  # Number of target distributions per sample

# Data splitting parameters
splitting:
  test_size: 0.2  # Fraction of data to use for testing
  validation_size: 0.1  # Fraction of data to use for validation
  random_state: 42  # Random seed for reproducible splits
  shuffle: true  # Whether to shuffle data before splitting

# Data loading parameters
loading:
  batch_size: null  # Will use training.batch_size if null
  num_workers: 2  # Fewer workers for CPU training
  pin_memory: false  # No pin_memory for CPU training
  drop_last: false  # Don't drop incomplete batches
  shuffle: true  # Whether to shuffle data during training

# Data preprocessing parameters
preprocessing:
  normalize_features: false  # No normalization for CPU training
  normalize_targets: false  # No normalization for targets
  feature_scaling: "none"  # No scaling for CPU training
  target_scaling: "none"  # No scaling for targets 