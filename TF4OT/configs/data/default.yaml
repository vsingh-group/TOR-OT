# Default data configuration
hf_dataset:   ''
hf_cache_dir: ''

# Dataset parameters
dataset:
  support_size: 10  # Support size of the distributions

# Data splitting parameters
splitting:
  test_size: 0.2  # Fraction of data to use for testing
  validation_size: 0.1  # Fraction of data to use for validation
  random_state: 42  # Random seed for reproducible splits
  shuffle: true  # Whether to shuffle data before splitting

# Data loading parameters
loading:
  batch_size: null  # Will use training.batch_size if null
  num_workers: 32  # Number of workers for data loading
  pin_memory: true  # Whether to pin memory for faster GPU transfer
  drop_last: false  # Whether to drop incomplete batches
  shuffle: true  # Whether to shuffle data during training

# Data preprocessing parameters
preprocessing:
  normalize_features: false  # Whether to normalize input features
  normalize_targets: false  # Whether to normalize target values
  feature_scaling: "none"  # Scaling method: "none", "standard", "minmax"
  target_scaling: "none"  # Scaling method: "none", "standard", "minmax" 