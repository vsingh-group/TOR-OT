# Large dataset configuration for production training
data_dir: "./decoder4ot/experiments/singletarget/ot_sample_data/n_50k/support_20"

# Dataset parameters
dataset:
  size: 50000  # Large dataset for production training
  support_size: 20  # Larger support size for more complex distributions
  feature_dim: 21  # Dimension of input features
  target_dim: 1  # Dimension of target values
  num_targets: 1  # Number of target distributions per sample

# Data splitting parameters
splitting:
  test_size: 0.15  # Smaller test set for more training data
  validation_size: 0.05  # Smaller validation set
  random_state: 42  # Random seed for reproducible splits
  shuffle: true  # Whether to shuffle data before splitting

# Data loading parameters
loading:
  batch_size: null  # Will use training.batch_size if null
  num_workers: 64  # More workers for large dataset
  pin_memory: true  # Whether to pin memory for faster GPU transfer
  drop_last: true  # Drop incomplete batches for consistent training
  shuffle: true  # Whether to shuffle data during training

# Data preprocessing parameters
preprocessing:
  normalize_features: true  # Normalize features for better training
  normalize_targets: false  # Don't normalize targets for regression
  feature_scaling: "standard"  # Use standard scaling for features
  target_scaling: "none"  # No scaling for targets 