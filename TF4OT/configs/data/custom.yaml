# Custom data configuration
data_dir: "./decoder4ot/experiments/singletarget/ot_sample_data/n_5k/support_15"

dataset:
  size: 5000
  support_size: 15

splitting:
  test_size: 0.15
  validation_size: 0.15
  random_state: 42
  shuffle: true

loading:
  batch_size: null
  num_workers: 24
  pin_memory: true
  drop_last: false
  shuffle: true

preprocessing:
  normalize_features: true
  normalize_targets: false
  feature_scaling: "standard"
  target_scaling: "none" 