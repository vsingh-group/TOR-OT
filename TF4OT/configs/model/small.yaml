# Default model configuration
save_path: "./experiments/trained_models/"
encoder:
# encoder for source:a and target:b
  encoder_ab:
    #MLP encoder
    input_dim:    ${data.dataset.input_total_dim}
    emb_dim_ab:   256
# encoder for cost matrix c
  encoder_c:
    #TF encoder
    input_dim:    ${data.dataset.input_cost_matrix_dim}   # <-- link to feature_dim
    emb_dim_c:    256
decoder:
  emb_dim_d:              256
  max_seq_len:            512
  num_transformer_layers: 8
  num_attention_heads:    8
  dropout:                0