# Default model configuration
save_path: "./experiments/trained_models/"
encoder:
# encoder for distributions source:a and target:b
  encoder_ab:
    #MLP encoder
    input_dim:    ${data.dataset.input_total_dim}
    emb_dim_ab:   768
# encoder for cost matrix
  encoder_c:
    #TF encoder
    input_dim:    ${data.dataset.input_cost_matrix_dim}   # <-- link to feature_dim
    emb_dim_c:    768
decoder:
  emb_dim_d:              768
  max_seq_len:            512
  num_transformer_layers: 24
  num_attention_heads:    16
  dropout:                0