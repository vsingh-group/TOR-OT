# Quiet logging configuration for Hydra
# This can be referenced in main config files as: logging=quiet
# Only shows ERROR and CRITICAL messages - WARNING messages are completely excluded

# Environment variables to suppress external library warnings
env:
  TF_CPP_MIN_LOG_LEVEL: "3"  # Suppress TensorFlow warnings
  JAX_PLATFORM_NAME: "cpu"    # Reduce JAX warnings
  XLA_PYTHON_CLIENT_PREALLOCATE: "false"
  XLA_PYTHON_CLIENT_ALLOCATOR: "platform"

# Basic logging configuration - minimal output
logging:
  level: ERROR
  format: '%(levelname)s: %(message)s'
  date_format: '%Y-%m-%d %H:%M:%S'
  
  # File logging - disabled for quiet mode
  file:
    enabled: false
  
  # Console output - only errors and critical
  console:
    enabled: true
    level: ERROR
    stream: "ext://sys.stdout"
  
  # Disable existing loggers
  disable_existing_loggers: false
  
  # Explicitly filter out warnings
  filters:
    - name: "no_warnings"
      level: ERROR

# Hydra job logging configuration - minimal
hydra:
  job_logging:
    version: 1
    formatters:
      simple:
        format: '%(levelname)s: %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        level: ERROR
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: ERROR
      handlers: [console]
    disable_existing_loggers: false
    
    # Explicitly suppress warnings
    loggers:
      # Suppress all warnings from any logger
      "":  # Root logger
        level: ERROR
        propagate: false 