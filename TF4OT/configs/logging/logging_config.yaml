# Comprehensive Logging Configuration for Decoder4OT
# This file contains all logging-related configurations

# =============================================================================
# LOGGING CONFIGURATION
# =============================================================================

# Main logging configuration
logging:
  # Overall logging level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
  level: INFO
  
  # Log message format
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  
  # Date format for timestamps
  date_format: '%Y-%m-%d %H:%M:%S'
  
  # File logging configuration
  file:
    enabled: true
    filename: "training.log"
    mode: "w"
    level: INFO
    max_bytes: 10485760  # 10MB
    backup_count: 5
  
  # Console output configuration
  console:
    enabled: true
    level: INFO
    stream: "ext://sys.stdout"
  
  # Disable existing loggers
  disable_existing_loggers: false
  
  # Log rotation settings
  rotation:
    enabled: true
    max_size: "10MB"
    backup_count: 5
    when: "midnight"
    interval: 1

# Hydra-specific logging configuration
hydra_logging:
  version: 1
  formatters:
    simple:
      format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
    detailed:
      format: '%(asctime)s - %(name)s - %(levelname)s - %(funcName)s:%(lineno)d - %(message)s'
  handlers:
    console:
      class: logging.StreamHandler
      level: INFO
      formatter: simple
      stream: ext://sys.stdout
    file:
      class: logging.FileHandler
      level: INFO
      formatter: detailed
      filename: ${hydra:runtime.output_dir}/train_regression_singletarget_hydra.log
      mode: w
    error_file:
      class: logging.FileHandler
      level: ERROR
      formatter: detailed
      filename: ${hydra:runtime.output_dir}/errors.log
      mode: w
  root:
    level: INFO
    handlers: [console, file, error_file]
  disable_existing_loggers: false

# Job logging configuration (for Hydra)
job_logging:
  version: 1
  formatters:
    simple:
      format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  handlers:
    console:
      class: logging.StreamHandler
      level: INFO
      formatter: simple
      stream: ext://sys.stdout
    file:
      class: logging.FileHandler
      level: INFO
      formatter: simple
      filename: ${hydra:runtime.output_dir}/job.log
      mode: w
  root:
    level: INFO
    handlers: [console, file]
  disable_existing_loggers: false

# Logging examples and presets
logging_example:
  # Quiet logging (minimal output)
  quiet:
    level: WARNING
    console:
      enabled: true
      level: WARNING
    file:
      enabled: false
  
  # Verbose logging (detailed output)
  verbose:
    level: DEBUG
    console:
      enabled: true
      level: DEBUG
    file:
      enabled: true
      level: DEBUG
    format: '%(asctime)s - %(name)s - %(levelname)s - %(funcName)s:%(lineno)d - %(message)s'
  
  # Production logging (balanced)
  production:
    level: INFO
    console:
      enabled: true
      level: INFO
    file:
      enabled: true
      level: INFO
      max_bytes: 10485760  # 10MB
      backup_count: 10

# =============================================================================
# USAGE EXAMPLES
# =============================================================================
# 
# To use different logging levels:
# - logging.level: DEBUG    # Most verbose
# - logging.level: INFO     # Standard (default)
# - logging.level: WARNING  # Only warnings and errors
# - logging.level: ERROR    # Only errors
# - logging.level: CRITICAL # Only critical errors
#
# To use different presets:
# - logging=quiet      # Minimal output
# - logging=verbose    # Detailed output
# - logging=production # Balanced output
#
# To disable file logging:
# - logging.file.enabled: false
#
# To disable console output:
# - logging.console.enabled: false
#
# To change log file location:
# - logging.file.filename: "custom_training.log"
#
# To enable log rotation:
# - logging.rotation.enabled: true
# - logging.rotation.max_size: "50MB"
# - logging.rotation.backup_count: 10 