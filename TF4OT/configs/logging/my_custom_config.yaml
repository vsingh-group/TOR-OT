# My custom training configuration
# This is a standalone config file that can be used directly

# Global settings
data_dir: "./decoder4ot/experiments/singletarget/ot_sample_data/n_10k/support_10"
model_save_path: null

# Model configuration
model:
  save_path: "./decoder4ot/experiments/singletarget/trained_models"
  encoder:
    output_dim: 128
    dist_support_size: 10
    embedding_dim: 16
  decoder:
    units: 256
    num_transformer_layers: 4
    num_attention_heads: 4
    dropout: 0.1

# Training configuration
training:
  num_epochs: 50
  batch_size: 8
  learning_rate: 2e-4
  use_amp: true
  grad_accumulation: 1
  world_size: null

# Tokenizer configuration
tokenizer:
  num_exponent_digits: 2
  num_mantissa_digits: 6

# Data configuration
data:
  data_dir: "./decoder4ot/experiments/singletarget/ot_sample_data/n_10k/support_10"
  dataset:
    size: 10000
    support_size: 10
    feature_dim: 21
    target_dim: 1
    num_targets: 1
  splitting:
    test_size: 0.2
    validation_size: 0.1
    random_state: 42
    shuffle: true
  loading:
    batch_size: null
    num_workers: 32
    pin_memory: true
    drop_last: false
    shuffle: true
  preprocessing:
    normalize_features: false
    normalize_targets: false
    feature_scaling: "none"
    target_scaling: "none" 