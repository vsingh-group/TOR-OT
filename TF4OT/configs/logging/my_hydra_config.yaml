# My custom configuration
# This can be used directly with the training routine

# Override the defaults
defaults:
  - model: default
  - training: default
  - tokenizer: default
  - data: default
  - _self_

# Global settings
data_dir: "./decoder4ot/experiments/singletarget/ot_sample_data/n_10k/support_10"
model_save_path: null

# Override specific parameters

model:
  encoder:
    output_dim: 128
  decoder:
    units: 256
    num_transformer_layers: 4
    dropout: 0.1

training:
  num_epochs: 50
  batch_size: 8
  learning_rate: 2e-4
  use_amp: true
  grad_accumulation: 1
  world_size: null

data:
  dataset:
    size: 10000
    support_size: 10
  loading:
    num_workers: 24 