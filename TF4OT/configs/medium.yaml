# My custom configuration
# This can be used directly with the training routine

# Override the defaults
defaults:
  - data: default
  - model: default
  - training: default
  - tokenizer: default
  - logging: default
  - _self_

# Override specific parameters

data:
  #data_dir: "./experiments/singletarget/data/n_10k/support_10"
  data_hf: "ivanjaenm/singletarget_ot-data-n-1M-sup-10-unif"
  dataset:
    size_n: 1_000_000
    size_s: "1M"
    support_size: 10
    feature_dim: 21
    num_targets: 1
  loading:
    num_workers: 20

model:
  save_path:      "./experiments/singletarget/models"
  encoder:
    support_size: ${data.dataset.support_size}
    input_dim:    ${data.dataset.feature_dim}   # <-- link to feature_dim
    output_dim:   128
  decoder:
    units: 128
    num_transformer_layers: 1
    num_attention_heads: 1
    dropout: 0

training:
  num_epochs:     150
  batch_size:     512
  learning_rate:  1e-4
  use_amp: true
  grad_accumulation: 1
  world_size: null #null will use all gpus. 0 will use cpu

tokenizer:
  num_exponent_digits: 2
  num_mantissa_digits: 6

inference:
  out_dir:      "./experiments/singletarget/results"
  top_k_values: [null, 3, 5]
  top_p_values: [null, 0.1, 0.5]
  use_amp:      ${training.use_amp}
  batch_size:   4046
  threshold:    50