# ToR-OT default training configuration (~70M parameters).
data:
  repo_id: ivanjaenm/torot_data_1M      # uniform-on-simplex marginals, six distinct 1D costs; a local save_to_disk directory also works
  cache_dir: null
  train_split: train
  val_split: val
  max_bins: 200
  transpose_aug_prob: 0.5
  residual_noise: 0.01          # row decoding: noise on the remaining capacities, and small fake leftovers in
  residual_leftover_prob: 0.25  # used-up columns, so the model tolerates its own slightly wrong earlier rows
  residual_leftover_range: [1.0e-6, 0.01]
  num_workers: 8

tokenizer:
  mantissa_digits: 4
  max_exponent: 9

model:
  d_model: 512
  n_heads: 8
  enc_layers: 6
  dec_layers: 12
  d_ff: 1408
  fourier_bands: 8
  dropout: 0.0
  max_seq_len: 4096
  decoding: row         # the paper's model ("plan": one sequence for the whole plan)

loss:
  digit_weight_decay: 0.5
  exponent_weight: 1.0
  ordinal_eps: 0.05
  z_loss: 1.0e-4

optim:
  lr: 1.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.1
  warmup_steps: 1000
  max_steps: 50000
  min_lr_ratio: 0.1
  batch_size: 512       # max instances per device batch; the token budget below binds first
  max_tokens: 65536     # padded tokens per device batch (row decoding: encoder tokens; halve on 24 GB GPUs)
  max_dec_tokens: 24576 # cap on padded decoder tokens per forward pass: larger batches are split into
                        # micro-batches with gradient accumulation (one long row pads the whole batch)
  grad_clip: 1.0
  ema_decay: 0.999

run:
  out_dir: experiments/torot/base
  seed: 0
  log_every: 50
  val_every: 1000
  val_batches: 20
  val_decode_instances: 256
  max_decode_len: 2048
  bf16: true
  compile: false
  resume: null
