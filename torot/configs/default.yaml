# ToR-OT v2 default training configuration (~70M parameters).
data:
  repo_id: ivanjaenm/torot_data_1M      # uniform-on-simplex marginals, six distinct 1D costs; a local save_to_disk directory also works
  cache_dir: null
  train_split: train
  val_split: val
  max_bins: 200
  transpose_aug_prob: 0.5
  num_workers: 8

tokenizer:
  mantissa_digits: 4
  max_exponent: 9

model:
  d_model: 512
  n_heads: 8
  enc_layers: 6
  dec_layers: 12
  d_ff: 1408
  fourier_bands: 8
  dropout: 0.0
  max_seq_len: 4096

loss:
  digit_weight_decay: 0.5
  exponent_weight: 1.0
  ordinal_eps: 0.05
  z_loss: 1.0e-4

optim:
  lr: 1.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.1
  warmup_steps: 1000
  max_steps: 50000      # ~17 epochs of the 1M corpus on 4 GPUs (~2.9K steps/epoch/GPU), ~6.5 h on A100s
  min_lr_ratio: 0.1
  batch_size: 512       # max instances per device batch; the token budget below binds first
  max_tokens: 65536     # padded decoder tokens per device batch: ~33 GB peak on A100-40GB at 70M params
                        # (use 32768 on 24 GB GPUs: same tokens/s within ~12%, double max_steps)
  max_dec_tokens: null  # cap on padded decoder tokens per forward pass: larger batches are split into
                        # micro-batches with gradient accumulation (row mode: max_tokens counts encoder
                        # tokens only, and one long row pads the whole batch)
  grad_clip: 1.0
  ema_decay: 0.999

run:
  out_dir: experiments/torot/base
  seed: 0
  log_every: 50
  val_every: 1000
  val_batches: 20
  val_decode_instances: 256
  max_decode_len: 2048
  bf16: true
  compile: false
  resume: null
