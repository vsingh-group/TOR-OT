# Small-scale ablation testbed (App. G): row-mode ToR-OT, 9.8M parameters, n <= 30.
# Corpus: ivanjaenm/torot_data_1M filtered to n <= 30 (reproduce/build_n30_corpus.py). One GPU, 11,000 steps.
# Ablations change one entry each (reproduce/run_ablation.sh); this file is the base recipe, the same as the
# paper's 1D model's except for size, corpus and step count.
data:
  repo_id: experiments/torot/ablations/corpus_n30
  cache_dir: null
  train_split: train
  val_split: val
  max_bins: 200
  transpose_aug_prob: 0.5
  residual_noise: 0.01
  residual_leftover_prob: 0.25
  residual_leftover_range:
  - 1.0e-06
  - 0.01
  num_workers: 8
tokenizer:
  mantissa_digits: 4
  max_exponent: 9
model:
  d_model: 256
  n_heads: 4
  enc_layers: 4
  dec_layers: 6
  d_ff: 704
  fourier_bands: 8
  dropout: 0.0
  max_seq_len: 4096
  decoding: row
loss:
  digit_weight_decay: 0.5
  exponent_weight: 1.0
  ordinal_eps: 0.05
  z_loss: 0.0001
optim:
  lr: 0.0003
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_steps: 500
  max_steps: 11000
  min_lr_ratio: 0.1
  batch_size: 2048
  max_tokens: 131072
  grad_clip: 1.0
  ema_decay: 0.999
run:
  out_dir: experiments/torot/ablations/base
  seed: 0
  log_every: 100
  val_every: 500
  val_batches: 5
  val_decode_instances: 256
  max_decode_len: 2048
  bf16: true
  compile: false
  resume: null
